[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-seance"
version = "0.1.0"
description = "A haunted CLI companion: Agnes, a Victorian ghost who died in the Y2K incident, reacts to your shell commands. Powered by open-weight Gemma via OpenRouter — or any OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "terminal-seance contributors" }]
keywords = [
    "cli", "shell", "ghost", "halloween", "hacktoberfest", "dia-de-los-muertos",
    "gemma", "openrouter", "openai-compatible", "llama-cpp", "lm-studio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "playwright>=1.45",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/terminal-seance/terminal-seance"

[project.scripts]
seance = "seance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
